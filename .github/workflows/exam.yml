name: Examine candidates

# Stage 1 of a company-sampled batch: an examiner agent screens each company's candidates in star
# order and pre-registers goal + hidden oracle for the eligible ones. The collect job commits them
# BEFORE any probe runs, so the commit timestamp is the pre-registration.
on:
  workflow_dispatch:
    inputs:
      companies:
        description: "JSON list of companies from data/candidates.json"
        default: '["Google","Meta","Microsoft","NVIDIA","Alibaba","Tencent","ByteDance","Baidu"]'
      max_parallel:
        description: "Concurrent examiner jobs (subscription rate limits)"
        default: "3"
      target:
        description: "Override eligible-per-company target (smoke runs only; empty = pre-registered 10)"
        default: ""

permissions:
  contents: write

jobs:
  exam:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        company: ${{ fromJSON(inputs.companies) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: docker build -q -t rr-cpu -f base/Dockerfile.cpu base
      - name: Examine
        env:
          RR_IMAGE: rr-cpu
          RR_TRACK: cpu-gha
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          COMPANY: ${{ matrix.company }}
          RR_EXAM_TARGET: ${{ inputs.target }}
        run: python run_probe.py --exam-company "$COMPANY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: exam-${{ matrix.company }}
          path: |
            data/exams/
            oracles/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: exam-logs-${{ matrix.company }}
          path: runs/
          retention-days: 30

  collect:
    needs: exam
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: exam-*
          path: _exam
      - name: Merge verdicts and oracles, plan the run list
        run: |
          mkdir -p data/exams oracles
          for d in _exam/exam-*/; do
            case "$d" in *exam-logs-*) continue;; esac
            cp -n "$d"data/exams/*.json data/exams/ 2>/dev/null || true
            cp -n "$d"oracles/*.sh oracles/ 2>/dev/null || true
          done
          if ! ls data/exams/*.json >/dev/null 2>&1; then
            echo "No examiner verdicts were produced; nothing to pre-register." | tee plan.txt
            echo "NO_VERDICTS=1" >> "$GITHUB_ENV"; exit 0
          fi
          python plan_batch.py | tee plan.txt
      - name: Commit pre-registration
        if: env.NO_VERDICTS != '1'
        run: |
          git config user.name "doesitrun-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exams oracles repos_cpu.json
          git diff --cached --quiet && exit 0
          git commit -m "Pre-register CPU batch: examiner verdicts and hidden oracles" -m "$(tail -1 plan.txt)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
